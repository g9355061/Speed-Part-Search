name: Weekly Demand Forecast Refresh

# 每週日凌晨 03:00 ET 跨期查詢 150 顆料件（mode=full），累積每週一筆價格曲線資料點。
# GitHub Actions cron 使用 UTC：07:00 UTC = 03:00 EDT（夏令）/ 02:00 EST（冬令，會差 1 小時，屬正常 DST 偏移）。
on:
  schedule:
    - cron: '0 7 * * 0'
  workflow_dispatch: {} # 允許手動觸發測試

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger full forecast refresh
        env:
          BASE_URL: ${{ secrets.FORECAST_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::缺少 repo secrets：FORECAST_BASE_URL 或 CRON_SECRET"
            exit 1
          fi

          # mode=full 一次查不完 150 顆：Railway 邊緣會在約 50 秒切斷（502），且 Mouser 限流讓全程需數分鐘。
          # 對策：迴圈呼叫多次。伺服器漸進寫入快照 + 12 小時快取跳過，已查過的會被略過，故可接力完成。
          # 當所有料件都已是最新快取時，mode=full 會「快速回 200」(數秒) → 視為完成。
          # 先用一次 mode=cached 驗證 CRON_SECRET 是否正確（避免整輪都因 307/401 失敗）。
          AUTH_CODE=$(curl -sS -o /dev/null -w "%{http_code}" -H "x-cron-secret: $CRON_SECRET" \
            "$BASE_URL/api/demand-forecast?mode=cached")
          if [ "$AUTH_CODE" != "200" ]; then
            echo "::error::驗證失敗 HTTP $AUTH_CODE（307/401 代表 CRON_SECRET 與 Railway 不符）"
            exit 1
          fi

          DONE=0
          for i in $(seq 1 8); do
            echo "--- 第 $i 次 mode=full ---"
            set +e
            OUT=$(curl -s -o /dev/null -w "%{http_code} %{time_total}" --max-time 120 \
              -H "x-cron-secret: $CRON_SECRET" \
              "$BASE_URL/api/demand-forecast?mode=full&t=$RANDOM$i")
            set -e
            CODE=$(echo "$OUT" | awk '{print $1}')
            SECS=$(echo "$OUT" | awk '{print $2}')
            echo "http=$CODE time=${SECS}s"
            # 快速回 200（< 20 秒）代表全部已是最新快取 → 完成
            if [ "$CODE" = "200" ] && awk "BEGIN{exit !($SECS < 20)}"; then
              DONE=1
              echo "全部料件已更新完成。"
              break
            fi
            sleep 5
          done

          if [ "$DONE" = "1" ]; then
            echo "Weekly forecast refresh OK."
          else
            echo "::warning::迴圈結束仍未偵測到「快速 200」；伺服器端通常仍在背景完成，資料會陸續寫入。"
          fi
