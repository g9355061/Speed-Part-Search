name: Weekly Demand Forecast Refresh

# 每週日凌晨 03:00（深圳時間 UTC+8）查詢 150 顆料件（mode=full），累積每週一筆價格曲線資料點。
# GitHub Actions cron 使用 UTC：深圳週日 03:00 = UTC 週六 19:00（中國無 DST，全年固定）。
on:
  schedule:
    - cron: '0 19 * * 6'
  workflow_dispatch: {} # 允許手動觸發測試

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger full forecast refresh
        env:
          BASE_URL: ${{ secrets.FORECAST_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::缺少 repo secrets：FORECAST_BASE_URL 或 CRON_SECRET"
            exit 1
          fi

          # mode=full 一次查不完 150 顆：Railway 邊緣會在約 50 秒切斷（502），且 Mouser 限流讓全程需數分鐘。
          # 對策：迴圈呼叫多次。伺服器漸進寫入快照 + 12 小時快取跳過，已查過的會被略過，故可接力完成。
          # 當所有料件都已是最新快取時，mode=full 會「快速回 200」(數秒) → 視為完成。
          # 先用一次 mode=cached 驗證 CRON_SECRET 是否正確（避免整輪都因 307/401 失敗）。
          AUTH_CODE=$(curl -sS -o /dev/null -w "%{http_code}" -H "x-cron-secret: $CRON_SECRET" \
            "$BASE_URL/api/demand-forecast?mode=cached")
          if [ "$AUTH_CODE" != "200" ]; then
            echo "::error::驗證失敗 HTTP $AUTH_CODE（307/401 代表 CRON_SECRET 與 Railway 不符）"
            exit 1
          fi

          DONE=0
          for i in $(seq 1 8); do
            echo "--- 第 $i 次 mode=full ---"
            set +e
            OUT=$(curl -s -o /dev/null -w "%{http_code} %{time_total}" --max-time 120 \
              -H "x-cron-secret: $CRON_SECRET" \
              "$BASE_URL/api/demand-forecast?mode=full&t=$RANDOM$i")
            set -e
            CODE=$(echo "$OUT" | awk '{print $1}')
            SECS=$(echo "$OUT" | awk '{print $2}')
            echo "http=$CODE time=${SECS}s"
            # 快速回 200（< 20 秒）代表全部已是最新快取 → 完成
            if [ "$CODE" = "200" ] && awk "BEGIN{exit !($SECS < 20)}"; then
              DONE=1
              echo "全部料件已更新完成。"
              break
            fi
            sleep 5
          done

          if [ "$DONE" = "1" ]; then
            echo "迴圈偵測到快速 200，進入資料驗證。"
          else
            echo "迴圈未偵測到「快速 200」；伺服器可能仍在背景完成，以下用資料新鮮度驗證。"
          fi

          # 成敗以「資料實際新鮮」為準，不看迴圈有沒有跑完：
          # mode=cached 的 parts 需有 ≥140/150 顆的 queryTime 落在 24 小時內，
          # 否則以 error 失敗（GitHub 會寄通知信）——先前只印 warning，若哪週 API 掛了
          # 150 顆全沒更新也沒人知道，直到下週趨勢訊號全部靜默才發現。
          CUTOFF=$(( ( $(date +%s) - 86400 ) * 1000 ))
          FRESH=0
          for i in $(seq 1 10); do
            FRESH=$(curl -s --max-time 60 -H "x-cron-secret: $CRON_SECRET" \
              "$BASE_URL/api/demand-forecast?mode=cached" \
              | jq --argjson cutoff "$CUTOFF" '[.parts[] | select(.queryTime != null and .queryTime > $cutoff)] | length' 2>/dev/null || echo 0)
            echo "驗證第 $i 次：24 小時內查過的料件 $FRESH/150"
            if [ "$FRESH" -ge 140 ]; then break; fi
            sleep 60   # 邊緣切斷後伺服器仍在背景查，等它收尾再驗一次
          done

          if [ "$FRESH" -lt 140 ]; then
            echo "::error::本週查詢未完成：僅 $FRESH/150 顆料件在 24 小時內有新資料，趨勢快照可能斷檔（週報主訊號來源）。請檢查 Railway logs 與 DigiKey/Mouser API 狀態。"
            exit 1
          fi
          echo "Weekly forecast refresh OK（$FRESH/150 顆料件資料新鮮）。"
